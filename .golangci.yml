version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - noctx
    - revive
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      # 出力先への書き込みエラーは CLI として扱いようがないため除外する
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    presets:
      - comments
      - std-error-handling

formatters:
  enable:
    - gofmt
